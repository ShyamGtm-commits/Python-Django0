<!DOCTYPE html>
<html>
<head>
    <title>Delete Blog</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 0 auto; padding: 20px; }
        .blog-preview { border: 1px solid #ddd; padding: 15px; margin: 20px 0; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .delete-btn { background: #dc3545; color: white; }
        .cancel-btn { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <h1>🗑️ Delete Blog Post</h1>
    
    <div class="blog-preview">
        <h3>{{ object.title }}</h3>
        <p><strong>Author:</strong> {{ object.author }}</p>
        <p>{{ object.description|truncatewords:30 }}</p>
        <p><small>Created: {{ object.created_at|date:"F d, Y" }}</small></p>
    </div>
    
    <p><strong>⚠️ Are you sure you want to delete this blog post?</strong></p>
    <p>This action cannot be undone.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn delete-btn">Yes, Delete Permanently</button>
        <a href="{% url 'blog_list' %}" class="btn cancel-btn">Cancel</a>
    </form>
</body>
</html>
