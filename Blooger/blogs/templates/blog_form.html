<!DOCTYPE html>
<html>
<head>
    <title>{% if object %}Edit{% else %}Create{% endif %} Blog</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        textarea { height: 150px; resize: vertical; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .submit-btn { background: #28a745; color: white; }
        .cancel-btn { background: #6c757d; color: white; text-decoration: none; padding: 8px 15px; }
    </style>
</head>
<body>
    <h1>{% if object %}✏️ Edit{% else %}📝 Create New{% endif %} Blog Post</h1>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_title">Title:</label>
            {{ form.title }}
        </div>
        
        <div class="form-group">
            <label for="id_author">Author:</label>
            {{ form.author }}
        </div>
        
        <div class="form-group">
            <label for="id_description">Description:</label>
            {{ form.description }}
        </div>
        
        <div class="form-group">
            <label for="id_image">Image:</label>
            {{ form.image }}
            {% if object.image %}
                <p>Current: {{ object.image.name }}</p>
            {% endif %}
        </div>
        
        <div class="form-group">
            <label for="id_created_at">Created Date:</label>
            {{ form.created_at }}
        </div>
        
        <button type="submit" class="btn submit-btn">
            {% if object %}Update{% else %}Create{% endif %} Blog
        </button>
        <a href="{% url 'blog_list' %}" class="cancel-btn">Cancel</a>
    </form>
</body>
</html>
